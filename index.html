<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Piccolo Cafe • Küçük Mola, Büyük Lezzet</title>
    
    <!-- Tarayıcı İkonu (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%231A0A04' stroke='%23C8A97E' stroke-width='3'/%3E%3Cpath d='M30 40 L34 72 Q34 76 38 76 L62 76 Q66 76 66 72 L70 40 Z' fill='%233D1F0D' stroke='%23C8A97E' stroke-width='2'/%3E%3Cpath d='M70 48 Q84 48 84 58 Q84 68 70 68' stroke='%23C8A97E' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='50' cy='78' rx='30' ry='6' fill='none' stroke='%23C8A97E' stroke-width='2' opacity='0.6'/%3E%3Cpath d='M30 48 L34 68 Q34 71 38 71 L62 71 Q66 71 66 68 L70 48 Z' fill='%236B3A2A' opacity='0.7'/%3E%3Cpath d='M38 34 Q35 28 38 22 Q41 16 38 10' stroke='%23C8A97E' stroke-width='2' fill='none' stroke-linecap='round' opacity='0.8'/%3E%3Cpath d='M50 36 Q47 30 50 24 Q53 18 50 12' stroke='%23C8A97E' stroke-width='2' fill='none' stroke-linecap='round' opacity='0.6'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #F5ECD7;
            --warm-white: #FBF7F0;
            --latte: #C8A97E;
            --espresso: #3D1F0D;
            --mocha: #6B3A2A;
            --caramel: #A0632A;
            --foam: #EDE0CC;
            --dark-roast: #1A0A04;
            --gold: #C9A84C;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark-roast);
            color: var(--cream);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            cursor: none;
            font-weight: 400;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* CUSTOM CURSOR */
        .cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: var(--latte);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.1s ease;
            mix-blend-mode: screen;
        }
        .cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border: 1px solid var(--latte);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transition: all 0.15s ease;
            opacity: 0.5;
        }
        @media (max-width: 1024px) {
            body {
                cursor: auto;
            }
            .cursor,
            .cursor-ring {
                display: none;
            }
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 48px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(26, 10, 4, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(200, 169, 126, 0.1);
            transition: background 0.3s;
        }
        nav.scrolled {
            background: rgba(26, 10, 4, 0.95);
        }
        .nav-glow-line {
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            overflow: hidden;
        }
        .nav-glow-line svg {
            width: 200%;
            height: 2px;
            display: block;
            transition: transform 0.05s linear;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .nav-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--cream);
            letter-spacing: 0.05em;
        }
        .nav-logo-text span {
            color: var(--latte);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 36px;
            list-style: none;
        }
        .nav-links a {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--foam);
            text-decoration: none;
            position: relative;
            opacity: 0.75;
            transition: opacity 0.3s;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--latte);
            transition: width 0.3s ease;
            box-shadow: 0 0 6px var(--latte);
        }
        .nav-links a:hover {
            opacity: 1;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .lang-toggle {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(200, 169, 126, 0.08);
            border: 1px solid rgba(200, 169, 126, 0.2);
            border-radius: 20px;
            padding: 4px 6px;
        }
        .lang-btn {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            padding: 4px 10px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: var(--foam);
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
        }
        .lang-btn.active {
            background: var(--latte);
            color: var(--espresso);
            opacity: 1;
            font-weight: 700;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 1002;
        }
        .hamburger span {
            width: 24px;
            height: 2px;
            background: var(--cream);
            border-radius: 2px;
            transition: 0.3s;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* HERO */
        #hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .bg-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 2s ease;
            background-size: cover;
            background-position: center;
            animation: kenburns 10s ease infinite;
        }
        .bg-slide.active {
            opacity: 1;
        }
        @keyframes kenburns {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        /* Cafe fotoğrafları üzerine yarı saydam degrade */
        .bg-slide:nth-child(1) {
            background-image: 
                radial-gradient(ellipse at 30% 60%, rgba(107, 58, 42, 0.7) 0%, rgba(26, 10, 4, 0.85) 60%),
                url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1200&auto=format&fit=crop');
        }
        .bg-slide:nth-child(2) {
            background-image: 
                radial-gradient(ellipse at 70% 40%, rgba(160, 99, 42, 0.6) 0%, rgba(26, 10, 4, 0.85) 60%),
                url('https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=1200&auto=format&fit=crop');
        }
        .bg-slide:nth-child(3) {
            background-image: 
                radial-gradient(ellipse at 50% 80%, rgba(61, 31, 13, 0.8) 0%, rgba(26, 10, 4, 0.9) 60%),
                url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&auto=format&fit=crop');
        }

        /* PARTICLES */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--latte);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle var(--dur, 8s) ease-in-out var(--delay, 0s) infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) translateX(var(--dx, 20px)); opacity: 0; }
        }

        /* ATOM SCENE */
        .atom-scene {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            height: 320px;
            z-index: 2;
        }
        .atom-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 35% 35%, var(--cream), var(--latte), var(--caramel));
            border-radius: 50%;
            box-shadow: 0 0 20px var(--latte), 0 0 60px rgba(200,169,126,0.4), 0 0 120px rgba(200,169,126,0.15);
            animation: corePulse 2.5s ease-in-out infinite;
        }
        @keyframes corePulse {
            0%, 100% { transform: translate(-50%,-50%) scale(1); box-shadow: 0 0 20px var(--latte), 0 0 60px rgba(200,169,126,0.4); }
            50% { transform: translate(-50%,-50%) scale(1.25); box-shadow: 0 0 35px var(--latte), 0 0 90px rgba(200,169,126,0.6), 0 0 160px rgba(200,169,126,0.2); }
        }
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(200,169,126,0.35);
            border-radius: 50%;
            transform-origin: center;
        }
        .orbit-1 { width:140px; height:60px; margin:-30px 0 0 -70px; animation:orbit1 4s linear infinite; transform:rotateX(70deg) rotateZ(0deg); box-shadow:0 0 8px rgba(200,169,126,0.2); }
        .orbit-2 { width:180px; height:70px; margin:-35px 0 0 -90px; animation:orbit2 6s linear infinite; transform:rotateX(70deg) rotateZ(60deg); }
        .orbit-3 { width:240px; height:90px; margin:-45px 0 0 -120px; animation:orbit3 9s linear infinite; transform:rotateX(70deg) rotateZ(120deg); }
        @keyframes orbit1 { from { transform:rotateX(70deg) rotateZ(0deg); } to { transform:rotateX(70deg) rotateZ(360deg); } }
        @keyframes orbit2 { from { transform:rotateX(70deg) rotateZ(60deg); } to { transform:rotateX(70deg) rotateZ(420deg); } }
        @keyframes orbit3 { from { transform:rotateX(70deg) rotateZ(120deg); } to { transform:rotateX(70deg) rotateZ(480deg); } }
        .electron {
            position: absolute;
            width:10px; height:10px;
            background: var(--latte);
            border-radius:50%;
            box-shadow:0 0 12px var(--latte), 0 0 24px rgba(200,169,126,0.5);
            top:50%; left:0;
            margin:-5px 0 0 -5px;
        }

        /* HERO CONTENT */
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 580px;
            padding: 0 48px;
            left: 0;
        }
        .hero-tag {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.3em;
            color: var(--latte);
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 0.8s 0.3s forwards;
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(52px, 7vw, 88px);
            font-weight: 900;
            line-height: 1.0;
            color: var(--warm-white);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 0.9s 0.5s forwards;
        }
        .hero-title em {
            font-style: italic;
            color: var(--latte);
            display: block;
        }
        .hero-sub {
            font-size: clamp(16px, 2vw, 19px);
            font-weight: 300;
            line-height: 1.7;
            color: var(--foam);
            opacity: 0.8;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeUp 0.9s 0.7s forwards;
        }
        .hero-ctas {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.9s 0.9s forwards;
        }
        .btn-primary {
            padding: 14px 36px;
            background: linear-gradient(135deg, var(--latte), var(--caramel));
            color: var(--espresso);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.15);
            transform: translateX(-100%) skewX(-20deg);
            transition: transform 0.4s;
        }
        .btn-primary:hover::before { transform: translateX(100%) skewX(-20deg); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(200,169,126,0.4); }
        .btn-ghost {
            padding: 13px 36px;
            background: transparent;
            color: var(--cream);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border: 1px solid rgba(200,169,126,0.4);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-ghost:hover { border-color: var(--latte); background: rgba(200,169,126,0.08); box-shadow: 0 0 20px rgba(200,169,126,0.15); }
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: fadeUp 1s 1.5s forwards;
        }
        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--latte), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }
        @keyframes scrollPulse {
            0%,100% { opacity:0.3; transform:scaleY(1); }
            50% { opacity:1; transform:scaleY(0.6); }
        }
        .scroll-text {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.3em;
            color: var(--latte);
            opacity: 0.6;
            text-transform: uppercase;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to { opacity:1; transform:translateY(0); }
        }

        /* SECTIONS */
        section { padding: 120px 48px; position: relative; overflow: hidden; }
        .section-tag { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.3em; color:var(--latte); text-transform:uppercase; margin-bottom:16px; opacity:0.8; }
        .section-title { font-family:'Playfair Display',serif; font-size:clamp(36px,5vw,64px); font-weight:700; line-height:1.1; color:var(--warm-white); margin-bottom:20px; }
        .section-title span { color:var(--latte); }

        /* ABOUT */
        #about { background: linear-gradient(180deg, var(--dark-roast) 0%, #2A1208 50%, var(--dark-roast) 100%); display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center; max-width:1300px; margin:0 auto; padding:120px 80px; }
        .about-card { background: linear-gradient(135deg, rgba(200,169,126,0.08), rgba(107,58,42,0.15)); border:1px solid rgba(200,169,126,0.15); padding:60px 48px; position:relative; overflow:hidden; }
        .about-card::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:conic-gradient(from 0deg, transparent 0deg, rgba(200,169,126,0.05) 60deg, transparent 120deg); animation:rotateConic 12s linear infinite; }
        @keyframes rotateConic { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
        .about-number { font-family:'Playfair Display',serif; font-size:120px; font-weight:900; line-height:1; color:transparent; -webkit-text-stroke:1px rgba(200,169,126,0.2); display:block; margin-bottom:-20px; }
        .about-card-title { font-family:'Playfair Display',serif; font-size:28px; color:var(--cream); margin-bottom:12px; position:relative; }
        .about-card-body { font-size:16px; line-height:1.8; color:var(--foam); opacity:0.85; position:relative; }
        .about-text .section-body { font-size:clamp(16px,2vw,18px); line-height:1.9; color:var(--foam); opacity:0.85; margin-bottom:32px; }
        .stat-row { display:flex; gap:48px; margin-top:48px; }
        .stat-num { font-family:'Playfair Display',serif; font-size:42px; font-weight:700; color:var(--latte); line-height:1; display:block; }
        .stat-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.2em; color:var(--foam); opacity:0.6; text-transform:uppercase; }

        /* MENU */
        #menu { background:var(--dark-roast); max-width:1300px; margin:0 auto; padding:120px 80px; }
        .menu-header { text-align:center; margin-bottom:80px; }
        .menu-categories { display:flex; justify-content:center; gap:8px; margin-top:40px; flex-wrap:wrap; }
        .cat-btn { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; padding:10px 24px; border:1px solid rgba(200,169,126,0.25); background:transparent; color:var(--foam); cursor:pointer; transition:all 0.3s; opacity:0.6; }
        .cat-btn.active { background:rgba(200,169,126,0.12); border-color:var(--latte); color:var(--latte); opacity:1; }
        .menu-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:24px; margin-top:60px; }
        .menu-item { background:linear-gradient(145deg, rgba(200,169,126,0.06), rgba(107,58,42,0.1)); border:1px solid rgba(200,169,126,0.1); padding:32px 28px; position:relative; overflow:hidden; transition:all 0.4s; cursor:pointer; }
        .menu-item::after { content:''; position:absolute; bottom:0; left:0; width:0; height:2px; background:linear-gradient(90deg, var(--latte), var(--caramel)); transition:width 0.4s ease; box-shadow:0 0 10px var(--latte); }
        .menu-item:hover { transform:translateY(-4px); border-color:rgba(200,169,126,0.25); background:rgba(200,169,126,0.08); }
        .menu-item:hover::after { width:100%; }
        .item-name { font-family:'Playfair Display',serif; font-size:20px; color:var(--cream); margin-bottom:8px; }
        .item-desc { font-size:14px; line-height:1.6; color:var(--foam); opacity:0.7; }
        .menu-item.hidden { display:none; }

        /* GALLERY */
        #gallery { padding:120px 0; background:linear-gradient(180deg, var(--dark-roast), #200E06, var(--dark-roast)); overflow:hidden; }
        .gallery-header { text-align:center; margin-bottom:60px; padding:0 48px; }
        .gallery-track-wrap { overflow:hidden; margin-bottom:20px; }
        .gallery-track { display:flex; gap:20px; animation:galleryScroll 30s linear infinite; width:max-content; }
        .gallery-track:nth-child(2) { animation-direction:reverse; animation-duration:25s; }
        @keyframes galleryScroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }
        .gallery-card { width:260px; height:200px; flex-shrink:0; background:linear-gradient(135deg, rgba(200,169,126,0.12), rgba(107,58,42,0.2)); border:1px solid rgba(200,169,126,0.1); display:flex; align-items:center; justify-content:center; }
        .gallery-card-inner { display:flex; flex-direction:column; align-items:center; gap:12px; opacity:0.7; }
        .gallery-label { font-family:'Playfair Display',serif; font-size:16px; color:var(--cream); }

        /* TESTIMONIALS */
        #testimonials { background:var(--dark-roast); padding:120px 80px; max-width:1300px; margin:0 auto; }
        .testimonials-header { text-align:center; margin-bottom:80px; }
        .testimonials-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
        .testimonial-card { background:linear-gradient(145deg, rgba(200,169,126,0.06), rgba(107,58,42,0.08)); border:1px solid rgba(200,169,126,0.1); padding:40px 32px; transition:all 0.4s; }
        .testimonial-card:hover { border-color:rgba(200,169,126,0.3); transform:translateY(-6px); box-shadow:0 20px 60px rgba(0,0,0,0.4); }
        .testimonial-quote { font-size:48px; color:var(--latte); opacity:0.3; line-height:1; font-family:'Playfair Display',serif; margin-bottom:12px; }
        .testimonial-text { font-size:16px; font-style:italic; line-height:1.8; color:var(--foam); opacity:0.9; margin-bottom:28px; }
        .testimonial-author { display:flex; align-items:center; gap:14px; }
        .author-avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg, var(--mocha), var(--caramel)); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-size:16px; color:var(--cream); font-weight:700; }
        .author-name { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--cream); }
        .stars { color:var(--gold); font-size:13px; letter-spacing:2px; margin-bottom:8px; }

        /* CONTACT */
        #contact { background:linear-gradient(180deg, var(--dark-roast), #120500); padding:120px 80px; max-width:1300px; margin:0 auto; }
        .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:start; }
        .contact-info .section-body { font-size:16px; line-height:1.8; color:var(--foam); opacity:0.85; margin-bottom:48px; }
        .info-item { display:flex; gap:16px; align-items:flex-start; margin-bottom:28px; }
        .info-icon { width:40px; height:40px; border:1px solid rgba(200,169,126,0.3); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(200,169,126,0.05); }
        .info-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.2em; color:var(--latte); text-transform:uppercase; margin-bottom:4px; }
        .info-value { font-size:15px; color:var(--cream); line-height:1.5; }
        .res-form { display:flex; flex-direction:column; gap:20px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .form-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--latte); opacity:0.8; }
        .form-input { background:rgba(200,169,126,0.05); border:1px solid rgba(200,169,126,0.2); padding:14px 16px; color:var(--cream); font-family:'Montserrat',sans-serif; font-size:15px; outline:none; transition:border-color 0.3s, box-shadow 0.3s; cursor:pointer; }
        .form-input:focus { border-color:var(--latte); box-shadow:0 0 16px rgba(200,169,126,0.1); }
        .form-input::placeholder { color:rgba(200,169,126,0.3); }

        /* FOOTER */
        footer { background:var(--dark-roast); border-top:1px solid rgba(200,169,126,0.1); padding:60px 80px 40px; }
        .footer-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:48px; gap:40px; flex-wrap:wrap; }
        .footer-tagline { font-size:14px; color:var(--foam); opacity:0.5; margin-top:8px; font-style:italic; }
        .footer-links-col h4 { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:0.25em; color:var(--latte); text-transform:uppercase; margin-bottom:20px; }
        .footer-links-col ul li { margin-bottom:10px; }
        .footer-links-col ul li a { font-size:15px; color:var(--foam); opacity:0.65; text-decoration:none; transition:opacity 0.3s, color 0.3s; }
        .footer-bottom { border-top:1px solid rgba(200,169,126,0.08); padding-top:24px; display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:10px; color:var(--foam); opacity:0.4; letter-spacing:0.1em; flex-wrap:wrap; gap:12px; }

        /* FAB */
        .fab-container { position:fixed; bottom:36px; right:36px; z-index:5000; display:flex; flex-direction:column-reverse; align-items:flex-end; gap:12px; }
        .fab-main { width:56px; height:56px; background:linear-gradient(135deg, var(--latte), var(--caramel)); border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 24px rgba(200,169,126,0.4); transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:2; }
        .fab-main.open { transform:rotate(135deg); background:linear-gradient(135deg, var(--mocha), var(--espresso)); }
        .fab-sub { display:flex; flex-direction:column; gap:10px; overflow:hidden; max-height:0; opacity:0; transition:max-height 0.5s ease, opacity 0.3s; }
        .fab-sub.open { max-height:200px; opacity:1; }
        .fab-action { width:44px; height:44px; background:rgba(200,169,126,0.15); border:1px solid rgba(200,169,126,0.35); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.3s; transform:translateY(20px) scale(0.8); }
        .fab-sub.open .fab-action { transform:translateY(0) scale(1); }

        /* REVEAL */
        .reveal { opacity:0; transform:translateY(40px); transition:opacity 0.8s ease, transform 0.8s ease; }
        .reveal.visible { opacity:1; transform:translateY(0); }

        /* GRAIN OVERLAY */
        body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); opacity:0.35; }

        /* RESPONSIVE */
        @media (max-width:1024px) {
            .atom-scene { display:none; }
            #about { grid-template-columns:1fr; padding:80px 40px; }
            .testimonials-grid { grid-template-columns:1fr; }
            .contact-grid { grid-template-columns:1fr; }
        }
        @media (max-width:768px) {
            nav { padding:0 24px; }
            .nav-links { position:fixed; top:0; left:0; width:100%; height:100vh; background:rgba(26,10,4,0.98); backdrop-filter:blur(20px); flex-direction:column; align-items:center; justify-content:center; gap:2rem; transform:translateY(-100%); transition:transform 0.4s ease; z-index:1001; }
            .nav-links.active { transform:translateY(0); }
            .hamburger { display:flex; }
            section { padding:80px 24px; }
            #menu, #testimonials, #contact { padding:80px 24px; }
            footer { padding:40px 24px; }
            .form-row { grid-template-columns:1fr; }
            .gallery-card { width:200px; height:160px; }
            .menu-grid { grid-template-columns:1fr; }
            .stat-row { gap:24px; }
        }
    </style>
</head>
